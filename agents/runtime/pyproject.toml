[project]
name = "agent-runtime"
version = "0.1.0"
description = "Runs one Hermes employee: loads its job description, consumes its inbox, one Hermes turn per event."
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40",
    "pyyaml>=6",
]

[project.scripts]
agent-runtime = "agent_runtime.__main__:main"

[dependency-groups]
dev = [
    "moto[sqs]>=5.2",
    "pytest>=9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
