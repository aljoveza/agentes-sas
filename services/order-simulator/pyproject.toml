[project]
name = "order-simulator"
version = "0.1.0"
description = "Deterministic demo scenarios for the agentes-sas company, plus a per-order trace."
requires-python = ">=3.13"
dependencies = [
    "company-mcp",
    "fastmcp>=4.0,<5",
    "boto3>=1.43",
]

[project.scripts]
order-simulator = "order_simulator.__main__:main"

[dependency-groups]
dev = ["pytest>=9.1"]

[tool.uv.sources]
company-mcp = { path = "../company-mcp" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/order_simulator"]
