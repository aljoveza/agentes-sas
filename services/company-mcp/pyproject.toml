[project]
name = "company-mcp"
version = "0.1.0"
description = "Deterministic company tools (MCP) for the agentes-sas agent company."
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0,<5",
    "boto3>=1.43",
    "pydantic>=2.13",
    "httpx>=0.28",
    "uvicorn>=0.54",
]

[project.scripts]
company-mcp = "company_mcp.__main__:main"
company-mcp-seed = "company_mcp.seed:main"
company-mcp-proxy = "company_mcp.proxy:main"

[dependency-groups]
dev = [
    "moto[dynamodb,events,s3]>=5.2",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
