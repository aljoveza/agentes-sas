[project]
name = "agent-activity"
version = "0.1.0"
description = "Live activity of every agent (turns, tool calls, delegation, escalation), company-wide and per order."
requires-python = ">=3.13"
dependencies = []

[project.scripts]
agent-activity = "agent_activity.server:main"

[dependency-groups]
dev = ["pytest>=9.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_activity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
